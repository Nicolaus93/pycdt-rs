[package]
name = "pycdt-rs"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members = ["python"]

[lib]
name = "pycdt_rs"
crate-type = ["rlib"]

[dependencies]
delaunator = "1.0.2"
robust = "1"

[dev-dependencies]
divan = { version = "5.0.1", package = "codspeed-divan-compat" }
proptest = "1"
rand = "0.8"

[[bench]]
name = "triangulation"
harness = false


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
panic = "abort"
